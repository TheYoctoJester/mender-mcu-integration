####################################
# NXP i.MX RT1064-EVK — onboard Ethernet
####################################
# ENET MAC + Microchip KSZ8081 PHY (RMII). The ETH_NXP_ENET driver auto-enables
# from devicetree (enet_mac node is "okay"); we only need the Ethernet L2 here.
# IPv4 / DHCPv4 / TLS come from the application prj.conf.
CONFIG_NET_L2_ETHERNET=y

# Stable hardware unique ID — basis for a persistent Mender device identity.
CONFIG_HWINFO=y

# Networking tuning for the Mender artifact download (TLS, ~340KB from
# Cloudflare R2). Two distinct limits had to be raised:
#
# 1) NXP ENET DMA ring: defaults are only 6 RX / 1 TX buffers. Cloudflare bursts
#    at line rate, instantly exhausting 6 RX descriptors -> the MAC drops frames
#    -> Zephyr TCP loses segments and the transfer hard-stalls (~100-200KB in,
#    then a ~60s hang and DNS wedge). These are the real bottleneck; the higher
#    net_buf pool below is downstream and cannot help if the DMA ring overflows.
#    Max allowed by the driver is 16.
CONFIG_ETH_NXP_ENET_RX_BUFFERS=16
CONFIG_ETH_NXP_ENET_TX_BUFFERS=8
#
# 2) TCP window / net_buf pool: board defaults derive a ~1536-byte window, far
#    too small for the TLS handshake + download (it fails at offset 0). Keep the
#    recv window matched to what the 16 RX buffers can absorb to avoid re-drops.
CONFIG_NET_PKT_RX_COUNT=40
CONFIG_NET_PKT_TX_COUNT=40
CONFIG_NET_BUF_RX_COUNT=120
CONFIG_NET_BUF_TX_COUNT=120
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=8192
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=8192
# More DNS query slots: the download reconnects per chunk; a single slot wedges
# (EAI_CANCELED) once a connection stalls.
CONFIG_DNS_NUM_CONCUR_QUERIES=4
