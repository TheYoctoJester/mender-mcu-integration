manifest:

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: mender
      url-base: https://github.com/mendersoftware
    # Fork carrying the SDRAM-staging fix for the artifact download on i.MX RT
    # (XIP from the same FlexSPI NOR as the MCUboot slots). Temporary until the
    # change is merged upstream, then point mender-mcu back to remote 'mender'.
    - name: theyoctojester
      url-base: https://github.com/TheYoctoJester

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.2.0
      import:
        name-allowlist:
          - cmsis_6
          - mbedtls
          - mcuboot
          - hal_nxp
          - hal_nordic
          - hal_espressif
    - name: mender-mcu
      remote: theyoctojester
      revision: sdram-stage-download
      path: modules/mender-mcu
      import: true

  self:
    path: mender-mcu-integration
